# Поправка прогноза смога по датчикам: каждые 6 ч пересчитывает forecast/coeffs.json (Sensor.Community + Open-Meteo, без ключей).
name: Forecast coefficients
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forecast
  cancel-in-progress: false
jobs:
  coeffs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Fit coefficients
        run: node bot/forecast_coeffs.js
      - name: Commit
        run: |
          git config user.name "taza-aba-bot"
          git config user.email "bot@users.noreply.github.com"
          git add forecast/coeffs.json
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "forecast: coefficients $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
